name: Hyperspace pod adapter
on:
  push:
    paths:
      - 'harness/hyperspace_pod.py'
      - 'harness/test_hyperspace_pod.py'
      - 'harness/generate.py'
      - '.github/workflows/hyperspace-pod.yml'
  pull_request:
    paths:
      - 'harness/hyperspace_pod.py'
      - 'harness/test_hyperspace_pod.py'
      - 'harness/generate.py'
      - '.github/workflows/hyperspace-pod.yml'
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s harness -p 'test_hyperspace_pod.py' -v
